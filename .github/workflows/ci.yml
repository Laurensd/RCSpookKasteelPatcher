name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test RedCatPatcher.slnx -c Release

  release:
    name: Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          for rid in win-x64 linux-x64; do
            dotnet publish src/RedCatPatcher/RedCatPatcher.csproj -c Release -r "$rid" \
              -p:Version="$version" -o "dist/$rid"
          done

      - name: Package
        run: |
          mkdir -p out
          cp README.md dist/win-x64/ && cp README.md dist/linux-x64/
          (cd dist/win-x64 && zip -9 "../../out/RedCatPatcher-${GITHUB_REF_NAME}-windows-x64.zip" RedCatPatcher.exe README.md)
          (cd dist/linux-x64 && chmod +x RedCatPatcher && tar -czf "../../out/RedCatPatcher-${GITHUB_REF_NAME}-linux-x64.tar.gz" RedCatPatcher README.md)
          (cd out && sha256sum * > SHA256SUMS.txt)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "RedCat Spookkasteel patcher $GITHUB_REF_NAME" --generate-notes
