name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test RedCatPatcher.slnx -c Release
      # Zoals in de release: getrimd single-file met ReadyToRun, ook vanaf Linux
      - name: Publish launcher (win-x64)
        run: dotnet publish src/RedCatLauncher/RedCatLauncher.csproj -c Release -r win-x64 -o launcher-check

  release:
    name: Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          for rid in win-x64 linux-x64; do
            dotnet publish src/RedCatPatcher/RedCatPatcher.csproj -c Release -r "$rid" \
              -p:Version="$version" -o "dist/$rid"
          done
          # De launcher is altijd een Windows-programma; op Linux draait hij onder Proton naast RedCat.exe
          dotnet publish src/RedCatLauncher/RedCatLauncher.csproj -c Release -r win-x64 \
            -p:Version="$version" -o dist/launcher
          cp dist/launcher/RedCatLauncher.exe dist/win-x64/ && cp dist/launcher/RedCatLauncher.exe dist/linux-x64/

      - name: Package
        run: |
          mkdir -p out
          cp README.md dist/win-x64/ && cp README.md dist/linux-x64/
          (cd dist/win-x64 && zip -9 "../../out/RedCatPatcher-${GITHUB_REF_NAME}-windows-x64.zip" RedCatPatcher.exe RedCatLauncher.exe README.md)
          (cd dist/linux-x64 && chmod +x RedCatPatcher && tar -czf "../../out/RedCatPatcher-${GITHUB_REF_NAME}-linux-x64.tar.gz" RedCatPatcher RedCatLauncher.exe README.md)
          (cd out && sha256sum * > SHA256SUMS.txt)

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { on = index($0, "## [" v "]") == 1; next }
            /^\[[^]]+\]: / { next }
            on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::Geen sectie '## [$version]' gevonden in CHANGELOG.md"; exit 1
          fi
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "RedCat Spookkasteel patcher $GITHUB_REF_NAME" --notes-file notes.md
